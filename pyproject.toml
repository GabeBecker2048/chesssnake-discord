[project]
name = "chesssnake-discord"
version = "0.1.0"
description = "A Discord chess bot that plays through a chesssnake server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "chesssnake[client]>=0.15.4",
    "python-dotenv>=1.0",
]

[project.urls]
Source = "https://github.com/GabeBecker2048/chesssnake-discord"
chesssnake = "https://gabebecker.com/chesssnake/"

[project.scripts]
chesssnake-discord = "chesssnake_discord.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "chesssnake[api]>=0.15.4",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.setuptools]
packages = ["chesssnake_discord", "chesssnake_discord.cogs"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
