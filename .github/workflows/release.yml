# Pushing a tag vX.Y.Z publishes that version: the package to PyPI, the image to
# ghcr.io (amd64 and arm64), then a GitHub release with that version's CHANGELOG
# entry as its notes, the built package, and a compose.yaml pinned to it.
#
# No secrets. PyPI trusts this workflow through Trusted Publishing (OIDC): its
# publisher is this repository, release.yml and the `pypi` environment, so
# renaming any of them breaks uploads until PyPI's setting is changed too. The
# image is pushed with the automatic GITHUB_TOKEN. The release is created last,
# so a release page never exists for something that was not published.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Everything that can say "no" happens here, before anything is published.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: The tag matches pyproject.toml, and CHANGELOG.md has an entry
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^version = \"${version}\"$" pyproject.toml \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          test -s notes.md || { echo "::error::no '## ${version}' section in CHANGELOG.md"; exit 1; }
          echo "Release notes:"; cat notes.md
      - name: The compose file pins this minor version, and the release copy pins this exact one
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          grep -q "chesssnake-discord:${minor}$" compose.yaml \
            || { echo "::error::compose.yaml does not use the chesssnake-discord:${minor} image"; exit 1; }
          sed "s|chesssnake-discord:${minor}$|chesssnake-discord:${version}|" compose.yaml > release-compose.yaml
          grep -q "chesssnake-discord:${version}$" release-compose.yaml
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Build, and check the wheel is complete in a clean environment
        run: |
          set -euo pipefail
          uv build
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/python -c "import chesssnake_discord as c; print(c.__version__); assert c.setup and c.make_cog and c.ChessCog"
          # It exits 2 with no settings: that, and saying why, is the check.
          out=$(/tmp/wheel-check/bin/chesssnake-discord 2>&1) && exit 1 || true
          grep -q "Missing environment variable" <<<"$out"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            notes.md
            release-compose.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/chesssnake-discord/
    permissions:
      id-token: write # the OIDC token Trusted Publishing exchanges for an upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `skip-existing`: re-publishing a version already on PyPI should fail
        # loudly, not succeed quietly. PyPI never accepts a version number twice.

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # arm64 is emulated, hence the long timeout: a Raspberry Pi is a normal place
      # to run a bot like this.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gabebecker2048/chesssnake-discord
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [pypi, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release-compose.yaml compose.yaml
          gh release create "$GITHUB_REF_NAME" compose.yaml dist/* --repo "$GITHUB_REPOSITORY" \
            --title "chesssnake-discord ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag --latest
