name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run ruff check
      - run: uv run ruff format --check

  # The tests run the bot's service, relay and commands against a real chesssnake
  # server (chesssnake.testing), served on a local port for the websocket relay.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run pytest
      - name: Build, and check the wheel is complete in a clean environment
        run: |
          set -euo pipefail
          uv build
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/python -c "import chesssnake_discord as c; print(c.__version__); assert c.setup and c.make_cog and c.ChessCog"
          # It exits 2 with no settings: that, and saying why, is the check.
          out=$(/tmp/wheel-check/bin/chesssnake-discord 2>&1) && exit 1 || true
          grep -q "Missing environment variable" <<<"$out"

  # The image builds (not pushed): the release would otherwise be the first to find out.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The compose files are valid
        run: |
          touch .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet

  # One check for branch protection to require.
  all-green:
    needs: [lint, test, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.docker.result }}" = "success"
